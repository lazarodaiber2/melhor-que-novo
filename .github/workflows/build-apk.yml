name: Build MELHOR QUE NOVO APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q MELHOR_QUE_NOVO_PROJETO_ANDROID.zip -d .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd mqn_android_project
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: melhor-que-novo-apk
          path: mqn_android_project/app/build/outputs/apk/debug/app-debug.apk
